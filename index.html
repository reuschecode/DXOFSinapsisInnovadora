
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXOF+ | Framework de Blindaje Decisional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body {
            font-family: var(--font-main);
            background-color: #000000;
            color: white;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 {
            font-family: var(--font-main);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.05em;
        }
        .text-mono {
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
        }
        .bg-grain::before {
            content: "";
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
            opacity: 0.12;
            pointer-events: none;
            z-index: 50;
        }
        
        .img-brutalist {
            filter: grayscale(1) contrast(1.2) brightness(0.5);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .group:hover .img-brutalist {
            filter: grayscale(0.2) contrast(1.1) brightness(0.8);
            transform: scale(1.03);
        }

        .scanline {
            width: 100%;
            height: 4px;
            background: rgba(255, 0, 0, 0.2);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff0000;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-grain">
    <div id="root"></div>
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        window.addEventListener('load', () => {
            document.querySelectorAll('section, .reveal-item').forEach(el => {
                el.classList.add('reveal');
                observer.observe(el);
            });
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
